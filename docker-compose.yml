x-langfuse-env: &langfuse-env
  NODE_OPTIONS: "--max-old-space-size=1024"
  NEXTAUTH_URL: "http://localhost:3000"
  NEXTAUTH_SECRET: "local-secret-for-reproducible-benchmarking-32bytes"
  DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/postgres"
  SALT: "local-salt-for-langfuse-reproducibility-mas"
  ENCRYPTION_KEY: "a1b2c3d4e5f67890123456789abcdef0a1b2c3d4e5f67890123456789abcdef0"
  TELEMETRY_ENABLED: "false"

  # ClickHouse Configuration
  CLICKHOUSE_MIGRATION_URL: "clickhouse://clickhouse:9000"
  CLICKHOUSE_URL: "http://clickhouse:8123"
  CLICKHOUSE_USER: "clickhouse"
  CLICKHOUSE_PASSWORD: "clickhousepassword"
  CLICKHOUSE_CLUSTER_ENABLED: "false"

  # S3 / MinIO Configuration
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: "langfuse"
  LANGFUSE_S3_EVENT_UPLOAD_REGION: "auto"
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: "minio"
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: "miniosecret"
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: "http://minio:9000"
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: "events/"

  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: "langfuse"
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: "auto"
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: "minio"
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: "miniosecret"
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: "http://minio:9000"
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: "media/"

  # Redis Configuration
  REDIS_HOST: "redis"
  REDIS_PORT: 6379
  REDIS_AUTH: "myredissecret"

x-langfuse-depends-on: &langfuse-depends-on
  postgres:
    condition: service_healthy
  minio:
    condition: service_healthy
  redis:
    condition: service_healthy
  clickhouse:
    condition: service_healthy

services:
  langfuse-web:
    image: ghcr.io/langfuse/langfuse:4.72.0
    restart: always
    depends_on: *langfuse-depends-on
    ports:
      - "3000:3000"
    environment:
      <<: *langfuse-env
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      # Browser-facing media endpoint vs container-internal endpoint
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: "http://localhost:9090"
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: "http://minio:9000"
      # Headless Auto-Provisioning (isolated to Web service)
      LANGFUSE_INIT_ORG_ID: "mas-org"
      LANGFUSE_INIT_ORG_NAME: "MultiAgentSecurity"
      LANGFUSE_INIT_PROJECT_ID: "mas-project"
      LANGFUSE_INIT_PROJECT_NAME: "MultiAgentSecurity"
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: "pk-lf-local-mas"
      LANGFUSE_INIT_PROJECT_SECRET_KEY: "sk-lf-local-mas"
      LANGFUSE_INIT_USER_EMAIL: "admin@local.test"
      LANGFUSE_INIT_USER_NAME: "Admin"
      LANGFUSE_INIT_USER_PASSWORD: "adminpassword123"
    healthcheck:
      test: ["CMD-SHELL", "wget -T 3 --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/public/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  langfuse-worker:
    image: ghcr.io/langfuse/langfuse-worker:4.72.0
    restart: always
    depends_on: *langfuse-depends-on
    ports:
      - "127.0.0.1:3030:3030"
    environment: *langfuse-env

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: postgres
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  clickhouse:
    image: clickhouse/clickhouse-server:25.12
    restart: always
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhousepassword
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -T 3 --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  minio:
    image: cgr.dev/chainguard/minio
    restart: always
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    ports:
      - "127.0.0.1:9090:9000"
      - "127.0.0.1:9091:9001"
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: always
    command: >
      redis-server --requirepass myredissecret --maxmemory-policy noeviction
    environment:
      REDISCLI_AUTH: myredissecret
    volumes:
      - langfuse_redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
  langfuse_redis_data:
